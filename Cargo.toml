[workspace]
resolver = "3"
members = ["crates/traction-core", "crates/traction-daemon", "crates/traction-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.100.0"
publish = false

# Shared dependency versions are declared once here; member crates use
# `<dep>.workspace = true`. Cargo warns on unused (workspace) dependencies,
# so entries (including `traction-core = { path = "crates/traction-core" }`)
# are added by the first ticket that uses them.
[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
traction-core = { path = "crates/traction-core" }
# Daemon: a small async HTTP stack on a single-threaded runtime (RSS budget).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "sync", "time", "macros", "signal"] }
hyper = { version = "1.13.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "http1", "server-graceful"] }
http-body-util = { version = "0.1.5", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
getrandom = { version = "0.4.3", default-features = false }
subtle = { version = "2.6.1", default-features = false }
# Core: SHA-256 for Project IDs (and, from Step 3, the hash-chain).
sha2 = { version = "0.11.1", default-features = false }
# Core: the Step 3 hash-chain's Ed25519 Chain Links. `fast` (precomputed tables)
# and `rand_core` stay off: ~1 signature per 2 minutes, and the seed is supplied
# by the caller, so the core crate never needs an OS RNG.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
# Core dev-only: the credit-cap property suite (traction-core tests).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Windows-only: the single-instance named mutex (traction-daemon `lock.rs`).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
# Daemon: the file watcher (OS backends only, no polling) and its
# ignore-file matcher (gitignore semantics).
notify = { version = "9.0.0", default-features = false, features = ["macos_fsevent"] }
ignore = { version = "0.4.35", default-features = false }
# macOS-only: raising the soft open-file limit for FSEvents (watcher.rs).
libc = { version = "0.2.191", default-features = false }
# macOS-only: the foreground application's bundle ID (presence backend).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
# Linux-only: X11 presence backend (pure-Rust protocol, no libX11).
x11rb = { version = "0.14.0", default-features = false, features = ["xinput", "screensaver"] }
tempfile = { version = "3.27.0", default-features = false }
# Server (Step 4): Axum, runtime-checked SQLx (never the query! macros), TOML config.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "form", "tokio"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Daemon sync client: blocking HTTP(S) on its own thread (rustls, ring provider).
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
# Server (Step 4, S2): Hack Club OIDC. RS256 id-token verification only (the
# `rsa` crate with PKCS#1 v1.5, no encryption use) and base64url for JWT/PKCE.
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15", "encoding"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# Server (Step 4, S4): Jev frames are transcoded in memory, pure Rust on all
# 3 OSes: WebP decoding (`image-webp`) and baseline (SOF0) JPEG encoding
# (`jpeg-encoder`; progressive stays off).
image-webp = { version = "0.2.4", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
# Step 3b (S1): Visual Proof Mode. All capture work runs in the short-lived
# `capture-frame` child, never in the daemon process. Lossy WebP through the
# bundled libwebp (built by `cc`; the `image` integration stays off).
webp = { version = "0.3.1", default-features = false }
# The Vault: one XChaCha20-Poly1305 file per Frame (nonces drawn with
# `getrandom` by the caller, so the crate's own RNG feature stays off).
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# The S2 Capture Nonce schedule (HMAC-SHA256), shared by daemon and server.
hmac = { version = "0.13.0", default-features = false }
# macOS-only: ScreenCaptureKit single-shot `SCScreenshotManager` (macOS 14+).
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString", "NSProcessInfo"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGDirectDisplay", "CGError", "CGWindow"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCScreenshotManager", "SCShareableContent", "SCStream", "SCError", "block2", "objc2-core-graphics", "objc2-core-foundation"] }
